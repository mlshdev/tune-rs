services:
  tune:
    image: ghcr.io/mlshdev/tune-rs:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - /usr/bin/setpriv
      - "--reuid=${PUID:-1000}"
      - "--regid=${PGID:-1000}"
      - --clear-groups
      - --inh-caps=+net_admin
      - --ambient-caps=+net_admin
      - /usr/local/bin/tune
    command: ["run"]
    user: "0:0"  # setpriv drops to PUID/PGID before executing Tune, preserving NET_ADMIN.
    read_only: true
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN  # Observed: nftables and rtnetlink updates fail without it.
      - SETUID  # Observed: setpriv cannot switch from root to the configured UID without it.
      - SETGID  # Observed: setpriv cannot switch to the configured GID without it.
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.all.accept_ra: "2"
      net.ipv6.conf.default.accept_ra: "2"
      net.ipv4.ip_unprivileged_port_start: "0"
      net.ipv4.ping_group_range: "${PGID:-1000} ${PGID:-1000}"
    # Dedicated per-service env file: all application configuration comes from
    # here, never from the project-level .env shared by other stacks, so
    # variables cannot overlap in a multi-stack Compose environment.
    env_file:
      - "./tune/config/tune.env"
    environment:
      # Fixed container listeners must match compose.override.yml publications.
      HTTPPROXY_LISTENING_ADDRESS: "0.0.0.0:8888"
      SOCKS5_LISTENING_ADDRESS: "0.0.0.0:1080"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "./tune/config/servers:/gluetun/servers:rw"
      - "./tune/config/resolv.conf:/etc/resolv.conf:rw"
      - "./tune/data:/tmp/gluetun:rw"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    healthcheck:
      test: ["CMD", "/usr/local/bin/tune", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
